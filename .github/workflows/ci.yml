name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Syntax check and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Check Python syntax
        run: python -m compileall src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Package project
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create dist folder
        run: mkdir -p dist

      - name: Package project into ZIP
        run: |
          python -m zipfile -c "dist/Kit-numbers-${GITHUB_SHA::7}.zip" \
            src conf scripts tests README.md LICENSE INSTALL

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kit-numbers-${{ github.sha }}
          path: dist/
          retention-days: 7